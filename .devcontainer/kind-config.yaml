kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Проброс Grafana NodePort напрямую на localhost:30080 в Codespaces
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  # Проброс Mock Service
  - containerPort: 8000
    hostPort: 8000
    protocol: TCP
  # Проброс VictoriaMetrics TSDB
  - containerPort: 8428
    hostPort: 8428
    protocol: TCP
